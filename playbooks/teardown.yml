---
# Part 5: remove the Online Boutique. The cluster stays; redeploy with
# playbooks/app.yml. To stop or delete the VMs, use `vagrant halt` /
# `vagrant destroy -f` instead.
#   ansible-playbook playbooks/teardown.yml

- name: Remove the Online Boutique (the cluster stays)
  hosts: control_plane
  become: true
  vars_files:
    - ../vars/microservices.yml

  tasks:
    - name: Uninstall each Helm release
      kubernetes.core.helm:
        name: "{{ item.name }}"
        release_namespace: "{{ app_namespace }}"
        release_state: absent
      loop: "{{ microservices }}"
      loop_control:
        label: "{{ item.name }}"

    # Removes anything left that Helm did not create, and the namespace itself.
    - name: Delete the application namespace
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ app_namespace }}"
        state: absent
        wait: true
        wait_timeout: 300

    # app.yml clones it again at the pinned commit.
    - name: Remove the clone of the upstream charts
      ansible.builtin.file:
        path: "{{ src }}"
        state: absent
