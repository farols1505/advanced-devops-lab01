# Static inventory: the playbooks treat these VMs exactly like real servers.
# The private keys are generated per machine by `vagrant up`, so these paths
# only exist after it has completed (.vagrant/ is git-ignored).

[control_plane]
master ansible_host=192.168.56.10 ansible_ssh_private_key_file=.vagrant/machines/master/virtualbox/private_key

[workers]
node1 ansible_host=192.168.56.11 ansible_ssh_private_key_file=.vagrant/machines/node1/virtualbox/private_key

[k8s:children]
control_plane
workers

[k8s:vars]
ansible_user=vagrant
ansible_python_interpreter=/usr/bin/python3
