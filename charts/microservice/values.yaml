appName: servicename
appImage: gcr.io/google-samples/microservices-demo/servicename
appVersion: v0.2.3
appReplicas: 1
containerPort: 8080
containerEnvVars:
- name: ENV_VAR_ONE
  value: "valueone"
- name: ENV_VAR_TWO
  value: "valuetwo"

servicePort: 8080
serviceType: ClusterIP

# --- Lab01 extension (not in upstream) ---------------------------------------
# All empty/off by default, so the chart renders exactly like upstream unless
# a release sets them.
resources: {}        # requests/limits, rendered as-is
startupProbe: {}     # probe specs, rendered as-is (httpGet, grpc, tcpSocket, exec)
readinessProbe: {}
livenessProbe: {}
pdb:
  enabled: false     # PodDisruptionBudget; set minAvailable or maxUnavailable
